        function resetForm() {

        let lastSeenUpdateTimestamp = Date.now() / 1000;

        function checkForUpdate() {
            // Thêm ?t=... để ép trình duyệt luôn lấy dữ liệu mới từ Server
            fetch('/check_update?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success' && data.timestamp) {
                        // So sánh số với số: Cực kỳ chính xác, không lo múi giờ
                        if (data.timestamp > lastSeenUpdateTimestamp) {
                            lastSeenUpdateTimestamp = data.timestamp;
                            console.log("✅ Đã có dữ liệu mới, đang refresh...");
                            if (data.message) {
                                localStorage.setItem('reloadMessage', data.message);
                            }
                            // Chỉ reload nếu đang ở trang chủ (Home)
                            if (window.location.pathname === '/') {
                                location.reload();
                            } else {
                                console.log("ℹ️ Dữ liệu mới có sẵn nhưng không reload vì không ở trang chủ.");
                            }
                        }
                    }
                })
                .catch(err => console.error("❌ Lỗi fetch:", err));
        }

        if (window.location.pathname === '/') {
            setInterval(checkForUpdate, 60000);
        }

        window.addEventListener("load", function () {
            const reloadMessage = localStorage.getItem("reloadMessage");
            if (reloadMessage) {
                const messageDiv = document.getElementById("message-box").getElementsByClassName("message")[0];
                if (messageDiv) {
                    messageDiv.innerText = reloadMessage;
                    messageDiv.style.display = 'block';
                }
                localStorage.removeItem("reloadMessage");
            }
        });

        // Switch mode
        const toggle = document.getElementById('themeToggle');

        function applyTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                if (toggle) toggle.checked = true;
            } else {
                document.body.classList.remove('dark-mode');
                if (toggle) toggle.checked = false;
            }
        }

        if (toggle) {
            toggle.addEventListener('change', () => {
                const isDark = toggle.checked;
                document.body.classList.toggle('dark-mode', isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        }

        window.addEventListener('DOMContentLoaded', applyTheme);

        document.addEventListener('DOMContentLoaded', function() {
            const path = window.location.pathname;

                if (link.getAttribute('href') === path) {

                }

        // Sort column table
        function sortTable(columnIndex, th) {
            const table = document.getElementById("nftTable") || document.getElementById("positionTable") || document.getElementById("poolTable") || document.getElementById("bondTable");
            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.rows);
            const getCellValue = (row) => {
                const cell = row.cells[columnIndex];
                return cell.getAttribute("data-sort") || cell.innerText.trim().split('\n')[0];
            };

            // --- CẬP NHẬT 1: Hàm làm sạch dữ liệu chuyên biệt ---
            const cleanData = (val) => {
                if (!val) return "0";
                return val.toString().replace(/,/g, '')
                    .replace(/[$,%]/g, '')
                    .replace(/CAKE|AERO/gi, '')
                    .replace(/🌾|💰/g, '') // Xóa emoji nếu vẫn còn
                    .replace(/Harvest|Collect/gi, '') // Xóa text nếu vẫn còn
                    .trim();
            };

            const isNumeric = (val, cell) => {
                if (cell && cell.hasAttribute("data-sort")) return true;
                const cleaned = cleanData(val);
                return !isNaN(parseFloat(cleaned)) && isFinite(cleaned);
            };

            // Xác định thứ tự sort hiện tại
            let currentDir = th.getAttribute("data-dir");
            let newDir = currentDir === "asc" ? "desc" : "asc";

            // Xóa icon active cũ
            const allThs = table.querySelectorAll("th");
            allThs.forEach(t => {
                t.removeAttribute("data-dir");
                t.classList.remove("sort-asc", "sort-desc");
                let icon = t.querySelector(".sort-icon");
                if (icon) icon.classList.remove("active");
            });

            th.setAttribute("data-dir", newDir);
            th.classList.add(newDir === "asc" ? "sort-asc" : "sort-desc");
            let icon = th.querySelector(".sort-icon");
            if (icon) icon.classList.add("active");

            rows.sort((a, b) => {
                let cellA = a.cells[columnIndex];
                let cellB = b.cells[columnIndex];
                let aVal = getCellValue(a);
                let bVal = getCellValue(b);

                // --- CẬP NHẬT 3: Logic so sánh ---
                if (isNumeric(aVal, cellA) && isNumeric(bVal, cellB)) {
                    let aNum = parseFloat(cleanData(aVal));
                    let bNum = parseFloat(cleanData(bVal));

                    return newDir === "asc" ? aNum - bNum : bNum - aNum;
                }

                // So sánh chuỗi thông thường
                return newDir === "asc"
                    ? (aVal.localeCompare(bVal))
                    : (bVal.localeCompare(aVal));
            });

            rows.forEach(row => tbody.appendChild(row));
        }

        document.addEventListener("DOMContentLoaded", function () {
            const tokenFilterInput = document.getElementById("tokenFilter");
            const checkboxes = document.querySelectorAll(".chain-filter");
            const aprFilterCheckbox = document.getElementById("hide-zero-apr");
            const filterStatus = document.querySelectorAll(".status-filter");
            const filterDexType = document.querySelectorAll(".dex-filter");

            // --- SAVE & LOAD FILTER STATE ---
            function saveFilterState() {
                const state = {
                    token: tokenFilterInput ? tokenFilterInput.value.trim() : "",
                    chains: Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value),
                    hideZeroApr: aprFilterCheckbox.checked,
                    status: Array.from(filterStatus).filter(cb => cb.checked).map(cb => cb.value),
                    dexTypes: Array.from(filterDexType).filter(cb => cb.checked).map(cb => cb.value),
                };
                localStorage.setItem("nftFilterState", JSON.stringify(state));
            }

            function loadFilterState() {
                const path = window.location.pathname;
                const searchParams = new URLSearchParams(window.location.search);

                // Nếu đang ở home (không có query param) → reset filter
                if (path === "/" && !searchParams.toString()) {
                    return; // giữ nguyên filter mặc định trong HTML
                }

                // Ngược lại (ví dụ /?token=bonk) → restore từ localStorage
                const rawState = localStorage.getItem("nftFilterState");
                if (!rawState) return;

                const state = JSON.parse(rawState);

                if (tokenFilterInput) tokenFilterInput.value = state.token || "";

                checkboxes.forEach(cb => {
                    cb.checked = state.chains?.includes(cb.value) || false;
                });

                aprFilterCheckbox.checked = !!state.hideZeroApr;

                filterStatus.forEach(cb => {
                    cb.checked = state.status?.includes(cb.value) || false;
                });

                filterDexType.forEach(cb => {
                    cb.checked = state.dexTypes?.includes(cb.value) || false;
                });
            }

            let tableRows = [];

            function updateTableRows() {
                tableRows = Array.from(document.querySelectorAll("#nftTable tbody tr")).map(row => ({
                    el: row,
                    // Dùng data-search đã được backend chuẩn bị sẵn để đảm bảo chính xác
                    text: (row.getAttribute("data-search") || "").toUpperCase(),
                    chain: row.querySelector("td[data-label='Chain']")?.textContent.trim().toLowerCase() || "",
                    apr: parseFloat(row.querySelector("td[data-label='Farm APR 1h']")?.textContent.replace('%', '').trim()) || 0,
                    status: row.querySelector("td[data-label='Status']")?.textContent.trim().toLowerCase() || "",
                    dex_type: row.querySelector("td[data-label='DexType']")?.textContent.trim().toLowerCase() || "",
                }));
            }

            // --- INITIAL LOAD ---
            updateTableRows();

            // --- APPLY FILTER ---
            function applyFilter() {
                const tokenFilter = tokenFilterInput ? tokenFilterInput.value.trim().toUpperCase() : "";
                const selectedChains = Array.from(checkboxes)
                    .filter(checkbox => checkbox.checked)
                    .map(checkbox => checkbox.value.toLowerCase());

                const showOnlyZeroAPR = aprFilterCheckbox.checked;

                const selectedStatus = Array.from(filterStatus)
                    .filter(status => status.checked)
                    .map(status => status.value.toLowerCase());

                const selectedDexTypes = Array.from(filterDexType)
                    .filter(dex_type => dex_type.checked)
                    .map(dex_type => dex_type.value.toLowerCase());

                tableRows.forEach(row => {
                    const matchToken = !tokenFilter || row.text.includes(tokenFilter);
                    const matchChain = selectedChains.length === 0 || selectedChains.includes(row.chain);
                    const matchAPR = !showOnlyZeroAPR || row.apr <= 0.0001;
                    const matchStatus = selectedStatus.length === 0 || selectedStatus.includes(row.status);
                    const matchDexType = selectedDexTypes.length === 0 || selectedDexTypes.includes(row.dex_type);

                    row.el.style.display = (matchToken && matchChain && matchAPR && matchStatus && matchDexType) ? "" : "none";
                });
            }

            // --- RELOAD DATA FROM SERVER ---
            function reloadDataFromServer(token) {
                const currentState = {
                    token: tokenFilterInput ? tokenFilterInput.value.trim() : "",
                    chains: Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value),
                    hideZeroApr: aprFilterCheckbox.checked,
                    status: Array.from(filterStatus).filter(cb => cb.checked).map(cb => cb.value),
                    dexTypes: Array.from(filterDexType).filter(cb => cb.checked).map(cb => cb.value),
                };
                localStorage.setItem("nftFilterState", JSON.stringify(currentState));

                fetch(`/?token=${encodeURIComponent(token)}`)
                    .then(resp => resp.text())
                    .then(html => {
                        document.querySelector("#nftTable tbody").innerHTML = html;

                        // Cập nhật lại danh sách rows sau khi load mới
                        updateTableRows();

                        if (tokenFilterInput) tokenFilterInput.value = currentState.token;

                        checkboxes.forEach(cb => {
                            cb.checked = currentState.chains.includes(cb.value);
                        });

                        aprFilterCheckbox.checked = currentState.hideZeroApr;

                        filterStatus.forEach(cb => {
                            cb.checked = currentState.status.includes(cb.value);
                        });

                        filterDexType.forEach(cb => {
                            cb.checked = currentState.dexTypes.includes(cb.value);
                        });

                        applyFilter();
                    })
                    .catch(err => {
                        console.error("Error loading data:", err);
                    });
            }

            function debounce(fn, delay = 200) {
                let timer;
                return (...args) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn(...args), delay);
                };
            }

            // --- EVENTS ---
            if (tokenFilterInput) tokenFilterInput.addEventListener("keyup", debounce(() => {
                applyFilter();
                saveFilterState();
            }, 200));
            checkboxes.forEach(cb => cb.addEventListener("change", () => {
                applyFilter();
                saveFilterState();
            }));
            aprFilterCheckbox.addEventListener("change", () => {
                applyFilter();
                saveFilterState();
            });
            filterStatus.forEach(cb => cb.addEventListener("change", () => {
                applyFilter();
                saveFilterState();
            }));

            filterDexType.forEach(cb => cb.addEventListener("change", () => {
                applyFilter();
                saveFilterState();
            }));

            // Ví dụ: gắn reloadDataFromServer vào một nút "Filter from DB"
            const dbFilterBtn = document.getElementById("dbFilterBtn");
            if (dbFilterBtn) {
                dbFilterBtn.addEventListener("click", () => {
                    const token = tokenFilterInput.value.trim();
                    reloadDataFromServer(token);
                });
            }

            // --- INIT ---
            loadFilterState();
            applyFilter();
        });
